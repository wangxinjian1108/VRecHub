name: Check composed HOI image
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (large disk required for the full image)'
        type: string
        required: true
      image:
        description: 'Candidate image pinned by sha256 digest'
        type: string
        required: true
      scope:
        description: 'Check full aggregate or non-GRAIL component compatibility'
        type: choice
        options: [complete, components]
        required: true
        default: complete
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted-runner disk space
        if: inputs.runner == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull candidate
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          for attempt in 1 2 3; do
            if docker pull "$IMAGE"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'
          df -h
      - name: Check model environments and inference entry points
        env:
          IMAGE: ${{ inputs.image }}
          VERIFY_GRAIL: ${{ inputs.scope == 'complete' && 'yes' || 'no' }}
        run: |
          docker run --rm --network none \
            -v "$PWD/scripts/hoi/check_entrypoint.py:/tmp/check_entrypoint.py:ro" \
            -e VERIFY_GRAIL \
            --entrypoint /bin/bash "$IMAGE" -euo pipefail -c '
              human-object-interaction-smoke-test
              cd /app/LIGHT
              conda run --no-capture-output -n light python -c "import torch,pytorch3d,clip,smplx,spacy; from transformers.utils import is_torch_available; assert is_torch_available(); spacy.load(\"en_core_web_sm\")"
              conda run --no-capture-output -n light python /tmp/check_entrypoint.py sample.generate
              cd /app/InterAct/text2interaction
              conda run --no-capture-output -n interact python -c "import torch,pytorch3d,pointnet2_ops._ext,spacy; assert spacy.load(\"en_core_web_sm\")"
              conda run --no-capture-output -n interact python /tmp/check_entrypoint.py sample.local_generate_obj
              conda run --no-capture-output -n interact python /tmp/check_entrypoint.py sample.local_generate_obj_guide_contactv2
              conda run --no-capture-output -n haic python -c "import torch,isaaclab,isaacsim,active_adaptation; assert torch.version.cuda == \"12.8\""
              if [ "$VERIFY_GRAIL" = yes ]; then
                cd /workspace/grail
                /root/miniconda3/bin/conda run --no-capture-output -n grail python -c "import grail,soma; print(\"GRAIL ready\")"
                test -x /root/.cache/grail/envs/gem-x/bin/python
                test -x /workspace/grail/.venvs/moge3/bin/python
                test -x /workspace/grail/.venvs/mose3/bin/python
                test -x /workspace/grail/imports/soma-retargeter/.venv/bin/python
                /workspace/grail/imports/blender/blender --background --version | sed -n "1p"
              fi
            '
