name: Check composed HOI image
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (large disk required for the full image)'
        type: string
        required: true
      image:
        description: 'Candidate image pinned by sha256 digest'
        type: string
        required: true
      scope:
        description: 'Check full aggregate or non-GRAIL component compatibility'
        type: choice
        options: [complete, components]
        required: true
        default: complete
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted-runner disk space
        if: inputs.runner == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull candidate
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          for attempt in 1 2 3; do
            if docker pull "$IMAGE"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'
          df -h
      - name: Check model environments and inference entry points
        env:
          IMAGE: ${{ inputs.image }}
          HOI_CHECK_SCOPE: ${{ inputs.scope }}
        run: |
          docker run --rm --network none \
            -v "$PWD/scripts/hoi/check_entrypoint.py:/tmp/check_entrypoint.py:ro" \
            -v "$PWD/scripts/hoi/check_aggregate.sh:/tmp/check_aggregate.sh:ro" \
            -e HOI_CHECK_SCOPE \
            --entrypoint /bin/bash "$IMAGE" /tmp/check_aggregate.sh
