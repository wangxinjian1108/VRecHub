name: Check HOI inference entry points
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: light
            image: ghcr.io/wangxinjian1108/scene-edit-models-v5@sha256:60adbaf95bf7f7e725461b5d9b4365d2e56a5f28f24dde319fb4d8cad80e053a
          - model: interact
            image: ghcr.io/wangxinjian1108/hoi-interact-runtime@sha256:586c62661be70edde9761b2366c51787e9777b9f8e07d0d17b50a9b56e212767
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted-runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h
      - name: Pull runtime image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"
      - name: Check LIGHT inference entry point
        if: matrix.model == 'light'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --network none -w /app/LIGHT \
            -v "$PWD/scripts/hoi/check_entrypoint.py:/tmp/check_entrypoint.py:ro" \
            --entrypoint /bin/bash "$IMAGE" -c \
            '/opt/conda/envs/light/bin/python /tmp/check_entrypoint.py sample.generate && /opt/conda/envs/light/bin/python -c "import spacy; spacy.load(\"en_core_web_sm\")"'
      - name: Check InterAct inference entry points
        if: matrix.model == 'interact'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --network none -w /app/InterAct/text2interaction \
            -v "$PWD/scripts/hoi/check_entrypoint.py:/tmp/check_entrypoint.py:ro" \
            --entrypoint /bin/bash "$IMAGE" -c \
            '/opt/conda/envs/interact/bin/python /tmp/check_entrypoint.py sample.local_generate_obj && /opt/conda/envs/interact/bin/python /tmp/check_entrypoint.py sample.local_generate_obj_guide_contactv2'
