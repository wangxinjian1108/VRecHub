name: Chunk human-object-interaction-v1 weights

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/chunk-human-object-interaction-v1-weights.yml"
      - "docker/apps/human-object-interaction-v1-weights/Dockerfile.chunked"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push resumable weight chunks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/human-object-interaction-v1-weights/Dockerfile.chunked
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/human-object-interaction-v1-weights-chunks:latest
