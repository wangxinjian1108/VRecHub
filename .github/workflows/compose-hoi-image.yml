name: Compose HOI image layers
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run composition tests or publish a candidate'
        type: choice
        options: [verify, compose, components-check]
        required: true
        default: verify
      base:
        description: 'GRAIL system image pinned by sha256 digest'
        type: string
      hoi:
        description: 'CHOIS / OMOMO component pinned by sha256 digest'
        type: string
      light:
        description: 'LIGHT component pinned by sha256 digest'
        type: string
      interact:
        description: 'InterAct component pinned by sha256 digest'
        type: string
      haic:
        description: 'HAIC component pinned by sha256 digest'
        type: string
permissions:
  contents: read
  packages: write
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: scripts/hoi/compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Resolve pinned composition dependency
        run: go mod tidy
      - name: Check layer order and base image configuration
        run: go test ./...
      - name: Login to GHCR
        if: inputs.mode == 'compose' || inputs.mode == 'components-check'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose and publish candidate image
        if: inputs.mode == 'compose' || inputs.mode == 'components-check'
        env:
          BASE_IMAGE: ${{ inputs.base }}
          HOI_IMAGE: ${{ inputs.hoi }}
          LIGHT_IMAGE: ${{ inputs.light }}
          INTERACT_IMAGE: ${{ inputs.interact }}
          HAIC_IMAGE: ${{ inputs.haic }}
          MODE: ${{ inputs.mode }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$MODE" = components-check ]; then
            destination="ghcr.io/$OWNER/hoi-components-verification:candidate-$REVISION-$RUN_ID"
          else
            destination="ghcr.io/$OWNER/human-object-interaction-v2:candidate-$REVISION-$RUN_ID"
          fi
          go run . "$BASE_IMAGE" "$HOI_IMAGE" "$LIGHT_IMAGE" "$INTERACT_IMAGE" "$HAIC_IMAGE" "$destination"
