name: Docker – Pi4 with weights
on:
  push:
    branches: [master]
    paths:
      - 'docker/Pi4-with-weights/**'
      - '.github/workflows/docker-Pi4-with-weights.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docker/Pi4-with-weights/**'
      - '.github/workflows/docker-Pi4-with-weights.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi4
          tags: |
            type=raw,value=with-weights
            type=sha,prefix=with-weights-sha-,format=short
      - name: Build and push Pi4 with weights
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Pi4-with-weights/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
