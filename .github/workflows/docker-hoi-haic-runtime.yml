name: Docker – HOI HAIC runtime
on:
  push:
    branches: [master]
    paths:
      - 'docker/apps/hoi-haic-runtime/**'
      - 'thirdparty/HAIC'
      - '.github/workflows/docker-hoi-haic-runtime.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Checkout HAIC and simulator assets
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1 thirdparty/HAIC
          git -C thirdparty/HAIC lfs pull
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell
          sudo docker image prune -af
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/hoi-haic-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hoi-haic-runtime:latest
            ghcr.io/${{ github.repository_owner }}/hoi-haic-runtime:sha-${{ github.sha }}
