name: Docker – HOI InterAct runtime
on:
  push:
    branches: [master]
    paths:
      - 'docker/apps/hoi-interact-runtime/**'
      - 'thirdparty/InterAct'
      - '.github/workflows/docker-hoi-interact-runtime.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 thirdparty/InterAct
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell
          sudo docker image prune -af
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/hoi-interact-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hoi-interact-runtime:latest
            ghcr.io/${{ github.repository_owner }}/hoi-interact-runtime:sha-${{ github.sha }}
