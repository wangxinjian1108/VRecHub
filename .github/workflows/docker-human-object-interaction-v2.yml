name: Docker – human-object-interaction-v2 candidate
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label with at least 200 GB available for the build'
        required: true
        type: string
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/human-object-interaction-v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/human-object-interaction-v2:candidate-${{ github.sha }}
