name: Docker – sam3

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "docker/sam3/**"
      - "thirdparty/sam3"
      - ".github/workflows/docker-sam3.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/sam3/**"
      - "thirdparty/sam3"
      - ".github/workflows/docker-sam3.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ secrets.DOCKERHUB_USERNAME }}/sam3,enable=${{ secrets.DOCKERHUB_USERNAME != '' }}
            ghcr.io/${{ github.repository_owner }}/sam3
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sam3/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Zelos Harbor
        if: github.event_name != 'pull_request' && env.HARBOR_USERNAME != ''
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login harbor-volc.zelostech.com.cn:5443 --username=${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Tag and push to Zelos Harbor
        if: github.event_name != 'pull_request' && env.HARBOR_USERNAME != ''
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        run: |
          echo '${{ steps.meta.outputs.tags }}' | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            harbor_tag="harbor-volc.zelostech.com.cn:5443/zcloud_auto/sam3:${tag##*:}"
            docker tag "$tag" "$harbor_tag"
            docker push "$harbor_tag"
          done
