name: Docker – scene-edit-models-v2

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "docker/apps/scene-edit-models-v2/**"
      - "thirdparty/GVHMR"
      - "thirdparty/Motion2MixamoRig"
      - ".github/workflows/docker-scene-edit-models-v2.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/apps/scene-edit-models-v2/**"
      - "thirdparty/GVHMR"
      - "thirdparty/Motion2MixamoRig"
      - ".github/workflows/docker-scene-edit-models-v2.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init only required submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf git@github.com:
          # DPVO lives inside GVHMR but is optional, so do not recurse.
          git submodule update --init --depth 1 --jobs 2 \
            thirdparty/GVHMR \
            thirdparty/Motion2MixamoRig

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ secrets.DOCKERHUB_USERNAME }}/scene-edit-models-v2,enable=${{ secrets.DOCKERHUB_USERNAME != '' }}
            ghcr.io/${{ github.repository_owner }}/scene-edit-models-v2
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push scene editing v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/scene-edit-models-v2/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=scene-edit-models-v2
          cache-to: type=gha,mode=max,scope=scene-edit-models-v2
