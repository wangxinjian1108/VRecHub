name: Docker – vggt-omega

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "docker/vggt-omega/**"
      - "thirdparty/vggt-omega"
      - ".github/workflows/docker-vggt-omega.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/vggt-omega/**"
      - "thirdparty/vggt-omega"
      - ".github/workflows/docker-vggt-omega.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ secrets.DOCKERHUB_USERNAME }}/vggt-omega,enable=${{ secrets.DOCKERHUB_USERNAME != '' }}
            ghcr.io/${{ github.repository_owner }}/vggt-omega
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set runtime base tag for dev image
        id: runtime-base
        run: |
          echo "remote=ghcr.io/${{ github.repository_owner }}/vggt-omega:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "local=vggt-omega:runtime-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/vggt-omega/Dockerfile
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.runtime-base.outputs.remote }}
            ${{ steps.runtime-base.outputs.local }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Push runtime image tags
        if: github.event_name != 'pull_request'
        run: |
          declare -A seen=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            if [ -z "${seen[$tag]+x}" ]; then
              seen[$tag]=1
              docker push "${tag}"
            fi
          done <<'EOF'
          ${{ steps.meta.outputs.tags }}
          ${{ steps.runtime-base.outputs.remote }}
          EOF

      - name: Free disk before dev build
        run: |
          df -h
          LOCAL_TAG='${{ steps.runtime-base.outputs.local }}'
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -v "^${LOCAL_TAG}$" \
            | xargs -r docker rmi 2>/dev/null || true
          docker image prune -f
          docker builder prune -af --filter "until=24h"
          df -h

      - name: Docker metadata for dev image
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ secrets.DOCKERHUB_USERNAME }}/vggt-omega,enable=${{ secrets.DOCKERHUB_USERNAME != '' }}
            ghcr.io/${{ github.repository_owner }}/vggt-omega
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-sha-,format=short

      - name: Select dev base image
        id: dev-base
        run: |
          echo "image=${{ steps.runtime-base.outputs.local }}" >> "$GITHUB_OUTPUT"

      - name: Build dev image
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            tag_args+=(--tag "${tag}")
          done <<'EOF'
          ${{ steps.meta-dev.outputs.tags }}
          EOF

          label_args=()
          while IFS= read -r label; do
            [ -n "${label}" ] || continue
            label_args+=(--label "${label}")
          done <<'EOF'
          ${{ steps.meta-dev.outputs.labels }}
          EOF

          docker build \
            "${tag_args[@]}" \
            "${label_args[@]}" \
            --build-arg BASE_IMAGE="${{ steps.dev-base.outputs.image }}" \
            -f docker/vggt-omega/Dockerfile.dev \
            .

      - name: Push dev image tags
        if: github.event_name != 'pull_request'
        run: |
          declare -A seen=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            if [ -z "${seen[$tag]+x}" ]; then
              seen[$tag]=1
              docker push "${tag}"
            fi
          done <<'EOF'
          ${{ steps.meta-dev.outputs.tags }}
          EOF
