name: Pack HOI runtime component layers
on:
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [hoi, light, interact, haic]
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted-runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/apps/human-object-interaction-v2/Dockerfile.components
          target: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hoi-component-${{ matrix.component }}:sha-${{ github.sha }}
