name: Package human-object-interaction-v1 weights

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/package-human-object-interaction-v1-weights.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          df -h

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract pinned inference assets
        run: |
          docker pull \
            ghcr.io/wangxinjian1108/human-object-interaction-v1:with-weights
          docker create \
            --name hoi-weights-source \
            ghcr.io/wangxinjian1108/human-object-interaction-v1:with-weights
          mkdir -p "${GITHUB_WORKSPACE}/.hoi-weights"
          docker cp \
            hoi-weights-source:/models/. \
            "${GITHUB_WORKSPACE}/.hoi-weights"
          docker rm hoi-weights-source
          find "${GITHUB_WORKSPACE}/.hoi-weights" -type f \
            -printf '%P %s bytes\n' | sort

      - name: Upload CHOIS
        uses: actions/upload-artifact@v4
        with:
          name: hoi-chois
          path: ${{ github.workspace }}/.hoi-weights/chois
          compression-level: 0
          retention-days: 1

      - name: Upload OMOMO
        uses: actions/upload-artifact@v4
        with:
          name: hoi-omomo
          path: ${{ github.workspace }}/.hoi-weights/omomo
          compression-level: 0
          retention-days: 1

      - name: Upload CLIP
        uses: actions/upload-artifact@v4
        with:
          name: hoi-clip
          path: ${{ github.workspace }}/.hoi-weights/clip
          compression-level: 0
          retention-days: 1

      - name: Upload Kimodo
        uses: actions/upload-artifact@v4
        with:
          name: hoi-kimodo
          path: ${{ github.workspace }}/.hoi-weights/kimodo
          compression-level: 0
          retention-days: 1

      - name: Upload Llama metadata and tokenizer
        uses: actions/upload-artifact@v4
        with:
          name: hoi-llama-metadata
          path: |
            ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/*.json
            ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/LICENSE
            ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/README.md
            ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/USE_POLICY.md
          compression-level: 6
          retention-days: 1

      - name: Upload Llama shard 1
        uses: actions/upload-artifact@v4
        with:
          name: hoi-llama-00001
          path: ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/model-00001-of-00004.safetensors
          compression-level: 0
          retention-days: 1

      - name: Upload Llama shard 2
        uses: actions/upload-artifact@v4
        with:
          name: hoi-llama-00002
          path: ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/model-00002-of-00004.safetensors
          compression-level: 0
          retention-days: 1

      - name: Upload Llama shard 3
        uses: actions/upload-artifact@v4
        with:
          name: hoi-llama-00003
          path: ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/model-00003-of-00004.safetensors
          compression-level: 0
          retention-days: 1

      - name: Upload Llama shard 4
        uses: actions/upload-artifact@v4
        with:
          name: hoi-llama-00004
          path: ${{ github.workspace }}/.hoi-weights/text-encoders/meta-llama/Meta-Llama-3-8B-Instruct/model-00004-of-00004.safetensors
          compression-level: 0
          retention-days: 1

      - name: Upload LLM2Vec adapters
        uses: actions/upload-artifact@v4
        with:
          name: hoi-llm2vec
          path: ${{ github.workspace }}/.hoi-weights/text-encoders/McGill-NLP
          compression-level: 0
          retention-days: 1

      - name: Upload manifests and fixed BPS assets
        uses: actions/upload-artifact@v4
        with:
          name: hoi-manifests
          path: |
            ${{ github.workspace }}/.hoi-weights/weights-manifest.json
            ${{ github.workspace }}/.hoi-weights/omomo/stage1.pt
            ${{ github.workspace }}/.hoi-weights/omomo/stage2.pt
          compression-level: 6
          retention-days: 1
