name: Promote human-object-interaction-v1 to Zelos Harbor

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/promote-human-object-interaction-v1-internal.yml"
  workflow_dispatch:

concurrency:
  group: promote-human-object-interaction-v1
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium
          df -h

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated image from GHCR
        run: |
          docker pull \
            ghcr.io/wangxinjian1108/human-object-interaction-v1:with-weights

      - name: Login to Zelos Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | docker login \
            repo-volc.zelostech.com.cn \
            --username "$HARBOR_USERNAME" \
            --password-stdin

      - name: Retag and push internal latest
        run: |
          docker tag \
            ghcr.io/wangxinjian1108/human-object-interaction-v1:with-weights \
            repo-volc.zelostech.com.cn/zcloud/human-object-interaction-v1:latest
          docker push \
            repo-volc.zelostech.com.cn/zcloud/human-object-interaction-v1:latest
          docker buildx imagetools inspect \
            repo-volc.zelostech.com.cn/zcloud/human-object-interaction-v1:latest
